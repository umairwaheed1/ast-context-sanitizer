name: AST Verification Pipeline

on:
  push:
    branches: [ main, feature/advanced-ast-engine ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tiktoken pytest
      - name: Execute PyTest Suite
        run: |
          pytest tests/